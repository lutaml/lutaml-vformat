# See https://github.com/metanorma/cimas
name: release

# Least-privilege ceiling for rubygems-release.yml: contents:write (tag push),
# id-token:write (OIDC Trusted Publishing). No rubygems-api-key secret = the
# reusable workflow publishes via OIDC Trusted Publishing. No pat_token =
# github.token for git operations (all deps are public rubygems).
permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc
        required: true
        default: "skip"
  repository_dispatch:
    types: [do-release]

jobs:
  release:
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version }}
